services:
  web:
    image: node:22-slim
    working_dir: /app
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - .:/app
      # Keep installed deps in a named volume so they survive restarts
      # without polluting the host repo.
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Disable the project's HMR-suppression flag so Vite HMR is active.
      - DISABLE_HMR=false
    command: sh -c "npm install --no-audit --no-fund && npx tsx server.ts"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  node_modules:
